# Render Blueprint — backend (NestJS) + PostgreSQL สำหรับทดสอบ
# หน้าเว็บ (frontend/) ขึ้น Vercel แยก แล้วตั้ง BACKEND_URL ใน Vercel ให้ชี้ URL ของ service นี้
# Render → New → Blueprint → เลือก repo นี้ (อ่านไฟล์นี้เอง)
services:
  - type: web
    name: mis-repair-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mis-repair-db
          property: connectionString
      - key: CORE_HUB_URL
        value: https://csmju2030.jowave.com
      - key: CORE_HUB_JWKS_URL
        value: https://csmju2030.jowave.com/api/v1/.well-known/jwks.json
      - key: CORE_HUB_WEB_URL
        value: https://csmju2030.jowave.com
      - key: CORE_HUB_ISSUER
        value: core-hub
      - key: CORE_HUB_AUDIENCE
        value: csmju2030
      - key: SUBSYSTEM_ID
        value: csmju-maintenance-request
      # แผนฟรีไม่มีดิสก์ถาวร — รูปที่อัปโหลดหายเมื่อ deploy ใหม่ (พอสำหรับทดสอบ)
      - key: UPLOAD_DIR
        value: /data/uploads

databases:
  - name: mis-repair-db
    databaseName: repair_db
    plan: free
